[hard_constraints]
# Task validity (hard filters, in order):
#   1. env builds (docker build exits 0)
#   2. oracle reward == 1.0
#   3. nop reward == 0.0
#   4. verifier is deterministic (3 repeated oracle runs agree)
#   5. instruction is self-contained (no external URLs required)
#   6. canary GUID present in instruction.md / task.toml
# Soft scoring:
#   + novelty vs seed (semantic distance of instruction)
#   + difficulty signal (rollout failure with oracle success)
#   + diversity (domain/persona/language entropy vs produced set)

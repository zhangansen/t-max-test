# T-Max task-generation taxonomy for TerminalBench 3 seed-case migration.
# Each generated task samples ONE value per dimension (a "signature").
# The sampled signature drives prompt/模板选择 and fixture/verifier selection.

[seed_families]
# Capability anchors derived from TerminalBench 3's 70+ seed cases.
entity_resolution = { seeds = ["telecom-entity-resolution", "medical-claims-processing"], skills = ["blocking", "fuzzy-matching", "transitive-closure"] }
log_forensics = { seeds = ["session-window-debug", "wal-recovery-ordering"], skills = ["log-parsing", "reconstruction", "root-cause"] }
data_validation = { seeds = ["data-anonymization", "batched-eval-parity"], skills = ["schema-checking", "determinism", "policy-encoding"] }
protocol_debugging = { seeds = ["shadow-relay", "payments-pipeline-fix"], skills = ["protocol-analysis", "debugging", "state-machine"] }
cryptanalysis = { seeds = ["interleaved-vigenere", "bun-sourcemap-leak"], skills = ["crypto-math", "implementation", "side-channel"] }
perf_optimization = { seeds = ["nextjs-performance", "vf2-speedup-networkx"], skills = ["profiling", "algorithmics", "benchmarking"] }
db_ops = { seeds = ["live-database-cutover", "kv-live-surgery", "mvcc-lsm-compaction"], skills = ["sql", "migration", "consistency"] }
scientific_compute = { seeds = ["lake-temp-glm", "gsea-proteomics", "glycan-ms2-elucidation"], skills = ["numerics", "domain-knowledge", "pipeline"] }

